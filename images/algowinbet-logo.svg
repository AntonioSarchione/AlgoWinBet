<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Algo Gradient (Tech Cyan/Blue) -->
    <linearGradient id="algo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Win Gradient (Neon Emerald/Mint) -->
    <linearGradient id="win-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF87" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="100%" height="100%" rx="20" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Background Tech Grid Lines -->
  <g opacity="0.06" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
  </g>

  <!-- LOGO ICON GROUP -->
  <g transform="translate(45, 0)">
    <!-- Hexagon Outer Shield -->
    <polygon points="120,45 190,85 190,175 120,215 50,175 50,85" 
             fill="#0F172A" 
             fill-opacity="0.8"
             stroke="url(#shield-border)" 
             stroke-width="3" />

    <!-- Inner Hexagon Frame Accent -->
    <polygon points="120,58 178,92 178,168 120,202 62,168 62,92" 
             fill="none" 
             stroke="#1E293B" 
             stroke-width="1.5" 
             stroke-dasharray="4,4"/>

    <!-- Histogram / Odds Bars inside Hexagon -->
    <g opacity="0.25" fill="url(#algo-grad)">
      <rect x="75" y="140" width="8" height="25" rx="2" />
      <rect x="90" y="125" width="8" height="40" rx="2" />
      <rect x="105" y="110" width="8" height="55" rx="2" />
      <rect x="120" y="130" width="8" height="35" rx="2" />
      <rect x="135" y="95" width="8" height="70" rx="2" />
      <rect x="150" y="80" width="8" height="85" rx="2" />
    </g>

    <!-- Area Chart Gradient Fill -->
    <polygon points="72,150 92,130 112,142 142,92 168,70 168,168 72,168" 
             fill="url(#chart-fill)" />

    <!-- Dynamic Growth Line (Graph Curve) -->
    <path d="M 72 150 L 92 130 L 112 142 L 142 92 L 168 70" 
          fill="none" 
          stroke="url(#win-grad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Arrow Head (High Win Rate / Upward Trend) -->
    <path d="M 152 70 L 170 68 L 168 86" 
          fill="none" 
          stroke="url(#win-grad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Data Nodes (Algorithm Coordinates) -->
    <circle cx="72" cy="150" r="4" fill="#00F2FE" />
    <circle cx="92" cy="130" r="4" fill="#00F2FE" />
    <circle cx="112" cy="142" r="4" fill="#00F2FE" />
    <circle cx="142" cy="92" r="4" fill="#00FF87" filter="url(#subtle-glow)" />
    <circle cx="168" cy="70" r="5" fill="#00FF87" filter="url(#glow)" />
    <circle cx="168" cy="70" r="9" fill="none" stroke="#00FF87" stroke-width="1.5" opacity="0.6" />

    <!-- Checkmark Overlay (Victory Accent) -->
    <path d="M 98 178 L 112 190 L 142 160" 
          fill="none" 
          stroke="url(#win-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#subtle-glow)" />
  </g>

  <!-- BRAND NAME / TYPOGRAPHY GROUP -->
  <g transform="translate(265, 140)">
    <!-- Main Text: AlgoWinBet -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-0.5">
      <tspan fill="url(#algo-grad)">Algo</tspan>
      <tspan fill="url(#win-grad)" font-weight="900" filter="url(#subtle-glow)">Win</tspan>
      <tspan fill="#FFFFFF" font-weight="800">Bet</tspan>
    </text>

    <!-- Tech Divider Line -->
    <path d="M 0 18 L 380 18 L 400 32 L 530 32" 
          fill="none" 
          stroke="url(#algo-grad)" 
          stroke-width="2" 
          opacity="0.4" />
    
    <circle cx="0" cy="18" r="3" fill="#00F2FE" />
    <circle cx="380" cy="18" r="3" fill="#00FF87" />

    <!-- Tagline / Subtitle -->
    <text x="2" y="48" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#94A3B8">
      AI PREDICTIVE BETTING ALGORITHM
    </text>
  </g>

  <!-- TOP-RIGHT ACCENT BADGE (Live Status Indicator) -->
  <g transform="translate(680, 50)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1E293B" stroke="url(#win-grad)" stroke-width="1.5" opacity="0.9" />
    <!-- Pulse Animation Dot -->
    <circle cx="18" cy="14" r="4" fill="#00FF87" filter="url(#subtle-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="1" 
          fill="#00FF87">
      HIGH WIN-RATE
    </text>
  </g>
</svg>