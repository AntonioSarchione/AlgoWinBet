# Online data collection: one scheduler tick per run (see src/algowinbet/autorun.py). Nothing runs on the user's PC.
# Secrets (Settings > Secrets and variables > Actions): GOAL_API_KEY (or GOALAPI_KEY), ODDSPAPI_API_KEY, APIFOOTBALL_KEY, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.
#
# Budget of Actions minutes (private repo, 2,000 min/month): every job is billed in whole minutes (a tick takes about
# 1 minute including setup), so the cron only covers the hours when lineups and pre-kickoff prices matter:
# ~200 runs/week, ~850/month. GitHub starts most scheduled runs hours late or drops them: the real ticks come from an
# external pinger calling the dashboard route /api/tick (web/app/api/tick/route.ts, same hours); this cron is a fallback.
name: collect

on:
  schedule:
    - cron: "5 6 * * *"               # daily: fixtures, results, stats, history backfill, closing lines, daily odds snapshot
    - cron: "*/20 9-20 * * 5,6,0,1"    # Fri-Mon: domestic leagues (lineups window, pre-kickoff odds)
    - cron: "*/20 15-19 * * 2,3,4"     # Tue-Thu: Champions/Europa League and midweek rounds
  workflow_dispatch:
    inputs:
      publish:
        description: "Ripubblica l'analisi sulla dashboard anche senza dati nuovi"
        type: boolean
        default: false
      refresh:
        description: "Aggiornamento manuale: fotografia Sisal (2 richieste conteggiate, massimo 5 al mese) + storico gratuito"
        type: boolean
        default: false
      history:
        description: "Storico prezzi gratuito di tutte le partite future (richieste libere)"
        type: boolean
        default: false

concurrency:
  group: offline-db  # every run that writes the local database, one at a time (was: collect)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # the morning run counts the month's Actions minutes from the run list and starts the quality replay of a new model version

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # job start: the tick fills the minute already paid with free price reads and records the minutes it costs
      - run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      # uv installs the cached wheels in a couple of seconds (pip took ~12 s): every run is billed by the started minute
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8: pinned to the release
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e ".[turso]"
      # Turso blocked until 2026-11-01: a plain SQLite copy kept in the Actions cache (.github/actions/offline-db)
      - uses: ./.github/actions/offline-db
      - name: collect-auto
        env:
          GOALAPI_KEY: ${{ secrets.GOAL_API_KEY || secrets.GOALAPI_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          FORCE_PUBLISH: ${{ inputs.publish && '--force-publish' || '' }}
          MANUAL: ${{ inputs.refresh && '--manual' || '' }}
          HISTORY: ${{ inputs.history && '--history --max-seconds 900' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: algowinbet collect-auto --config configs/collect.json --db data/offline.db $FORCE_PUBLISH $MANUAL $HISTORY
      - name: save local database
        if: always() && hashFiles('data/offline.db') != ''
        uses: actions/cache/save@v6
        with:
          path: data/offline.db
          key: offline-db-${{ github.run_id }}-${{ github.run_attempt }}
      # Daily encrypted copy while the database lives only in the Actions cache (artifacts of a public repository are public:
      # never uploaded in clear). Restore: gpg --decrypt <file>.db.gz.gpg | gunzip > algowinbet.db
      - name: daily copy
        if: success()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "$(date -u +%H)" != "06" ] || [ -z "$BACKUP_PASSPHRASE" ]; then exit 0; fi
          algowinbet db-backup --src data/offline.db --out "backup/algowinbet-$(date -u +%F).db.gz"
          for f in backup/*.db.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f" <<< "$BACKUP_PASSPHRASE"
            rm -f "$f"
          done
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: db-daily-${{ github.run_id }}
          path: backup/*.db.gz.gpg
          retention-days: 10
          compression-level: 0
          if-no-files-found: ignore
