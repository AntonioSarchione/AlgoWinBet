name: secure-copy

# Turso blocked the account on 2026-10-10 (free plan over its monthly quota, reset on 2026-11-01): the runs work on
# data/offline.db, a plain SQLite copy kept in the Actions cache (.github/actions/offline-db). This run uploads an encrypted,
# compact copy of the newest one as an artifact, e.g. to look at the dashboard on a PC (no Turso connection).
# With "seed" it instead creates the first data/offline.db from the cached Turso replica (saved 2026-10-09 15:04 UTC), but
# only when the cache holds no offline copy yet: a newer one would be overwritten.
# Restore: download the artifact, then
#   gpg --decrypt algowinbet-copy-<date>.db.gz.gpg | gunzip > algowinbet.db
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Crea la copia locale per i run dalla replica di Turso (solo se non esiste ancora)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-db
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: restore local copy
        if: ${{ !inputs.seed }}
        uses: ./.github/actions/offline-db
      - name: restore database replica
        if: inputs.seed
        uses: actions/cache/restore@v6
        with:
          path: data/turso-replica.db*
          key: turso-replica-secure-${{ github.run_id }}
          restore-keys: turso-replica-
      - name: source
        id: src
        run: |
          if [ -f data/offline.db ]; then echo "path=data/offline.db" >> "$GITHUB_OUTPUT"
          else test -f data/turso-replica.db && echo "path=data/turso-replica.db" >> "$GITHUB_OUTPUT"; fi
      - name: compact copy
        env:
          SRC: ${{ steps.src.outputs.path }}
        run: algowinbet db-backup --src "$SRC" --out "backup/algowinbet-copy-$(date -u +%F-%H%M).db.gz"
      - name: encrypt copy
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE non impostato: copia NON caricata (mai in chiaro)"
            rm -f backup/*.db.gz
            exit 1
          fi
          for f in backup/*.db.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f" <<< "$BACKUP_PASSPHRASE"
            rm -f "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: db-copy-${{ github.run_id }}
          path: backup/*.db.gz.gpg
          retention-days: 90
          compression-level: 0
      - name: existing local copy
        if: inputs.seed
        id: existing
        uses: actions/cache/restore@v6
        with:
          path: data/offline.db
          key: offline-db-none
          restore-keys: offline-db-
          lookup-only: true
      - name: create local copy
        if: inputs.seed && steps.existing.outputs.cache-matched-key == ''
        run: |
          python - <<'PY'
          import sqlite3
          src = sqlite3.connect("file:data/turso-replica.db?mode=ro", uri=True)
          dst = sqlite3.connect("data/offline.db")
          src.backup(dst)
          n = dst.execute("SELECT COUNT(*) FROM quotes").fetchone()[0]
          dst.close(); src.close()
          print(f"copia locale creata: quotes {n}")
          PY
      - name: save local copy
        if: inputs.seed && steps.existing.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: data/offline.db
          key: offline-db-${{ github.run_id }}-seed
      - name: local copy already there
        if: inputs.seed && steps.existing.outputs.cache-matched-key != ''
        env:
          MATCHED: ${{ steps.existing.outputs.cache-matched-key }}
        run: |
          echo "::notice::copia locale già presente ($MATCHED), non sovrascritta"
