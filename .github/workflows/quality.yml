name: quality

# Weekly replay of the model on the finished matches (no API request): log loss, calibration, value test and CLV, saved on
# Turso for the "Qualità del modello" page.
# Started by the Monday morning collect run (actionsminutes.dispatch_quality): GitHub's own schedule never fired it.
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "settimane da rigiocare (fino a lunedì)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: offline-db  # every run that writes the local database, one at a time (was: quality)
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      # Turso blocked until 2026-11-01: a plain SQLite copy kept in the Actions cache (.github/actions/offline-db)
      - uses: ./.github/actions/offline-db
      - name: run
        env:
          PYTHONUNBUFFERED: "1"
          WEEKS: ${{ inputs.weeks }}
        run: algowinbet quality --db data/offline.db --weeks "${WEEKS:-60}" --save
      # Weekly backup: a compact, consistent copy of the whole database (VACUUM INTO + gzip, about 50 MB in October 2026),
      # encrypted (AES-256, passphrase in the BACKUP_PASSPHRASE secret) and kept as a run artifact for 3 weeks. Artifacts of a
      # public repository can be downloaded by anyone: the plain copy is never uploaded, and without the secret nothing is.
      # Restore: download the artifact, then
      #   gpg --decrypt algowinbet-<date>.db.gz.gpg | gunzip > algowinbet.db
      #   turso db create <name> --from-file algowinbet.db
      - name: weekly backup
        if: success()
        run: algowinbet db-backup --src data/offline.db --out "backup/algowinbet-$(date -u +%F).db.gz"
      - name: encrypt backup
        if: success()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::BACKUP_PASSPHRASE non impostato: backup NON caricato (mai in chiaro)"
            rm -f backup/*.db.gz
            exit 0
          fi
          for f in backup/*.db.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$f.gpg" "$f" <<< "$BACKUP_PASSPHRASE"
            rm -f "$f"
          done
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.db.gz.gpg
          retention-days: 21
          compression-level: 0  # already gzipped
          if-no-files-found: ignore  # no passphrase: nothing to upload, and no failed run for it
      # Fase 10 shadow test: the frozen LightGBM correction against Dixon-Coles on the cup matches played since it was frozen
      # (boost.py). Never a reason to fail the weekly replay or the backup.
      - name: LightGBM shadow test
        if: success()
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install -q "lightgbm>=4.3" && algowinbet boost-shadow --db data/offline.db --save
      # Site database (docs/SITE_DB.md): only the differences since the last push; without SITE_DATABASE_URL it does nothing
      - name: site push
        if: always() && hashFiles('data/offline.db') != ''
        env:
          SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
          SITE_AUTH_TOKEN: ${{ secrets.SITE_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: algowinbet site-push --db data/offline.db
      - name: save local database
        if: always() && hashFiles('data/offline.db') != ''
        uses: actions/cache/save@v6
        with:
          path: data/offline.db
          key: offline-db-${{ github.run_id }}-${{ github.run_attempt }}
