name: quality

# Weekly replay of the model on the finished matches (no API request): log loss, calibration, value test and CLV, saved on
# Turso for the "Qualità del modello" page.
on:
  schedule:
    - cron: "30 4 * * 1"   # Monday 04:30 UTC, after the weekend's results
  workflow_dispatch:
    inputs:
      weeks:
        description: "settimane da rigiocare (fino a lunedì)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: quality

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      - name: restore database replica  # the collect runs keep it fresh: only the latest changes are synced
        uses: actions/cache/restore@v6
        with:
          path: data/turso-replica.db*
          key: turso-replica-quality-${{ github.run_id }}
          restore-keys: turso-replica-
      - name: run
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
          TURSO_MODE: replica
          TURSO_REPLICA_PATH: data/turso-replica.db
          WEEKS: ${{ inputs.weeks }}
        run: algowinbet quality --db turso --weeks "${WEEKS:-60}" --save
      # Weekly backup: a compact, consistent copy of the whole database (VACUUM INTO + gzip, about 50 MB in October 2026),
      # kept as a run artifact for 3 weeks (3 copies, inside the 500 MB of artifact storage of a free private repo).
      # Restore: download the artifact, gunzip, then `turso db create <name> --from-file algowinbet-<date>.db`.
      - name: weekly backup
        if: success()
        env:  # reads the local replica only: no credentials needed
          TURSO_MODE: replica
          TURSO_REPLICA_PATH: data/turso-replica.db
        run: algowinbet db-backup --out "backup/algowinbet-$(date -u +%F).db.gz"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.db.gz
          retention-days: 21
          compression-level: 0  # already gzipped
          if-no-files-found: error
