# FotMob history in one long run (public pages, no key): what the daily slice of the collect ticks would read in two
# months. Actions > fotmob-backfill > Run workflow: it launches itself again while matches are left, and stops when the
# history is complete or a run saved nothing (FotMob paused or not answering: launch it by hand later).
# Its own concurrency group: the collect ticks (quotes, lineups, recent FotMob matches) never wait for it, and it takes
# the day's FotMob history slot first, so the ticks leave the history alone while it runs.
name: fotmob-backfill

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minuti di lettura per lancio (circa 1.800 partite in 130 minuti)"
        required: false
        default: "130"
      interval:
        description: "secondi tra una pagina e l'altra"
        required: false
        default: "1"

concurrency:
  group: fotmob-backfill
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # to launch itself again

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 130 minutes of reading: a wide margin, so a slow database never ends in a failed run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      - name: fotmob-backfill
        id: fill
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
          MINUTES: ${{ inputs.minutes }}
          INTERVAL: ${{ inputs.interval }}
        # inputs arrive as environment variables, never interpolated into the script (no shell injection)
        run: algowinbet fotmob-backfill --minutes "${MINUTES:-130}" --interval "${INTERVAL:-1}" --db turso
      - name: next run
        if: success() && steps.fill.outputs.left != '0' && steps.fill.outputs.left != '' && steps.fill.outputs.saved != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
          INTERVAL: ${{ inputs.interval }}
          LEFT: ${{ steps.fill.outputs.left }}
        run: |
          echo "ancora $LEFT partite: nuovo lancio"
          gh workflow run fotmob-backfill.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f minutes="${MINUTES:-130}" -f interval="${INTERVAL:-1}"
