# FotMob history in one long run (public pages, no key): what the daily slice of the collect ticks would read in two
# months. Actions > fotmob-backfill > Run workflow; launch it again until the log says nothing is left.
# Its own concurrency group: the collect ticks (quotes, lineups, recent FotMob matches) never wait for it, and it takes
# the day's FotMob history slot first, so the ticks leave the history alone while it runs.
name: fotmob-backfill

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minuti di lettura (circa 2.700 partite in 90 minuti)"
        required: false
        default: "90"
      interval:
        description: "secondi tra una pagina e l'altra"
        required: false
        default: "1"

concurrency:
  group: fotmob-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      - name: fotmob-backfill
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
          MINUTES: ${{ inputs.minutes }}
          INTERVAL: ${{ inputs.interval }}
        # inputs arrive as environment variables, never interpolated into the script (no shell injection)
        run: algowinbet fotmob-backfill --minutes "${MINUTES:-90}" --interval "${INTERVAL:-1}" --db turso
