# Manual probes run on GitHub instead of the user's PC (whose network blocks OddsPapi).
# Actions > probe > Run workflow. Keys come from repository secrets; the log never shows them.
name: probe

on:
  workflow_dispatch:
    inputs:
      source:
        description: "odds (OddsPapi), goal (GOAL API), apif (API-Football) oppure db (solo database)"
        type: choice
        options: [odds, goal, apif, db]
        default: odds
      command:
        description: "odds: account | tournaments | markets | probe   -   goal: leagues | probe"
        type: choice
        options: [account, tournaments, markets, leagues, probe, teams, inspect, remap, coverage, stats, stateval, remapstats, registry, rules, referees, preview, purgestats, quotes, snapshot, datasets, model, results, raw, status, test, bench, health, calibration, lineuphist, lineupfill, lineupeval, boosteval, boosttrain, scorers, scorereval, xieval, slipreview, lineuptiming, rawgrep, trends, fotmobcheck, resultholes, fotmobplayers, fotmobnext, resultsrefill, apiflink, xipreview, xinames, goalusage, xiplayer, fotmobkeys, fotmobref, playereval, pubcheck, fmresults, sliprules, teammap, fmrename, fdrelink, legbands, playerquotes, oddsrelink]
        default: account
      arg:
        description: "testo da cercare (tournaments/leagues) oppure path (probe), es. /odds"
        required: false
        default: ""
      params:
        description: "solo probe: parametri k=v separati da spazio, es. fixtureId=123 bookmakers=sisal.it"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: offline-db  # probes write the archive too (raw payloads, budget counters, fixes): one writer at a time
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      # Turso is no longer the working database: every probe reads and writes the archive (.github/actions/offline-db)
      - uses: ./.github/actions/offline-db
      - name: run
        env:
          GOALAPI_KEY: ${{ secrets.GOAL_API_KEY || secrets.GOALAPI_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          PYTHONUNBUFFERED: "1"
          SOURCE: ${{ inputs.source }}
          COMMAND: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
          PARAMS: ${{ inputs.params }}
        run: |
          # inputs arrive as environment variables, never interpolated into the script (no shell injection)
          DB=data/offline.db   # raw payloads and budget counters persist in the archive
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "remap" ]; then algowinbet remap-odds --db "$DB" && algowinbet inspect Denmark --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "coverage" ]; then algowinbet market-coverage --db "$DB" --book "${ARG:-sisal}"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "model" ]; then algowinbet model-check "$ARG" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "remapstats" ]; then algowinbet remap-odds --only-stats --db "$DB" && algowinbet stat-coverage --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "rules" ]; then pip install -q pypdf && python scripts/sisal_rules.py $ARG; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "lineupeval" ]; then algowinbet lineup-eval --weeks "${ARG:-10}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "lineupfill" ]; then algowinbet lineups-backfill ${ARG:+--max "$ARG"} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "boosttrain" ]; then pip install -q "lightgbm>=4.3" && algowinbet boost-train ${ARG:+--force} --db "$DB" && algowinbet boost-shadow --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "boosteval" ]; then pip install -q "lightgbm>=4.3" && algowinbet boost-eval --weeks "${ARG:-52}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "lineuptiming" ]; then algowinbet lineup-timing --days "${ARG:-7}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fotmobcheck" ]; then algowinbet fotmob-check --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "resultholes" ]; then algowinbet results-holes ${ARG:+--show "$ARG"} ${PARAMS:+--near} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fotmobplayers" ]; then algowinbet fotmob-players --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fotmobnext" ]; then read -ra lg <<< "${ARG:-55}"; algowinbet fotmob-next "${lg[@]}" ${PARAMS:+--n "$PARAMS"}; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "resultsrefill" ]; then dr=(); if [ "$PARAMS" = "dry" ]; then dr=(--dry-run); fi; algowinbet results-refill "${dr[@]}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "apiflink" ]; then read -ra dd <<< "$ARG"; algowinbet apif-link "${dd[@]}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "xipreview" ]; then algowinbet xi-preview --days "${ARG:-4}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "xinames" ]; then dr=(); if [ "$PARAMS" = "dry" ]; then dr=(--dry-run); fi; algowinbet xi-names --max "${ARG:-40}" "${dr[@]}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "goalusage" ]; then algowinbet goal-usage --days "${ARG:-3}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "xiplayer" ]; then algowinbet xi-player "$ARG" ${PARAMS:+--team "$PARAMS"} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "playereval" ]; then algowinbet player-eval --since "${ARG:-2026-01-01}" $(for x in $PARAMS; do echo "--$x"; done) --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fmresults" ]; then algowinbet results-fotmob $(for x in $PARAMS; do echo "--$x"; done) --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "legbands" ]; then algowinbet leg-bands --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "oddsrelink" ]; then algowinbet odds-relink --days "${ARG:-1}" ${PARAMS:+--again} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "playerquotes" ]; then algowinbet player-quotes --days "${ARG:-2}" ${PARAMS:+--name "$PARAMS"} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fdrelink" ]; then algowinbet dataset-relink --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fmrename" ]; then algowinbet fotmob-rename $(for x in $PARAMS; do echo "--$x"; done) --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "teammap" ]; then algowinbet team-map ${PARAMS:+--all} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "sliprules" ]; then algowinbet slip-rules --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "pubcheck" ]; then algowinbet pub-check --team "${ARG:-PSV}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fotmobref" ]; then algowinbet fotmob-referee --comp "${ARG:-Serie A}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "fotmobkeys" ]; then algowinbet fotmob-keys --comp "${ARG:-Serie A}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "slipreview" ]; then algowinbet slip-review --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "xieval" ]; then fm=(); if [ "$PARAMS" = "fotmob" ]; then fm=(--fotmob-absences); fi; algowinbet xi-eval --since "${ARG:-2026-07-01}" "${fm[@]}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "scorereval" ]; then algowinbet scorer-eval --since "${ARG:-2025-07-01}" ${PARAMS:+--tune} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "scorers" ]; then algowinbet scorer-check --days "${ARG:-14}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "lineuphist" ]; then algowinbet lineup-history-check --comp "${ARG:-Serie A}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "calibration" ]; then algowinbet registry-calibration --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "registry" ]; then algowinbet registry-check "$ARG" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "referees" ]; then algowinbet referees-backfill --db "$DB" && algowinbet stat-eval --stats cards --weeks "${ARG:-52}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "preview" ]; then algowinbet analysis-preview --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "purgestats" ]; then algowinbet registry-purge-stats ${ARG:+--apply} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "quotes" ]; then algowinbet quotes-check "$ARG" ${PARAMS:+--past "$PARAMS"} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "snapshot" ]; then algowinbet snapshot-check "$ARG" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "stateval" ]; then algowinbet stat-eval --weeks "${ARG:-26}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "stats" ]; then algowinbet stat-coverage ${ARG:+--all} --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "datasets" ]; then algowinbet dataset-report --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "results" ]; then algowinbet results-day "${ARG:-$(date -u -d yesterday +%F)}" --comp "$PARAMS" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "health" ]; then
            algowinbet health --save --db "$DB" && algowinbet db-backup --src "$DB" --out backup/test.db.gz --skip ${ARG:-blobs}; exit $?
          fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "bench" ]; then algowinbet db-bench; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "raw" ]; then algowinbet raw-last "$ARG" --source "${PARAMS:-goal}" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "trends" ]; then algowinbet trends-show --comp "$ARG" --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "rawgrep" ]; then algowinbet raw-last "$ARG" --source "" --grep "$PARAMS" --n 5 --max-lines 200 --dump 6000 --db "$DB"; exit $?; fi
          if [ "$SOURCE" = "db" ] && [ "$COMMAND" = "inspect" ]; then algowinbet inspect "$ARG" --db "$DB"; exit 0; fi
          if [ "$SOURCE" = "db" ]; then algowinbet teams --db "$DB"; exit 0; fi
          if [ "$SOURCE" = "apif" ]; then
            if [ "$COMMAND" = "probe" ]; then pa=(); for kv in $PARAMS; do pa+=(--param "$kv"); done; algowinbet apif probe "$ARG" "${pa[@]}" --db "$DB"; exit $?; fi
            if [ "$COMMAND" = "test" ]; then algowinbet apif test ${ARG:+--league "$ARG"} --past "$(date -u -d yesterday +%F)" --next "$(date -u -d tomorrow +%F)" --db "$DB"; exit $?; fi
            algowinbet apif status --db "$DB"; exit $?
          fi
          args=("$SOURCE" "$COMMAND")
          if [ "$COMMAND" != "account" ]; then args+=("$ARG"); fi
          if [ "$COMMAND" = "probe" ]; then for kv in $PARAMS; do args+=(--param "$kv"); done; fi
          algowinbet "${args[@]}" --db "$DB"

      # Site database (docs/SITE_DB.md): what a probe changed (results, registry...) reaches the dashboard
      - name: site push
        if: always() && hashFiles('data/offline.db') != ''
        env:
          SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
          SITE_AUTH_TOKEN: ${{ secrets.SITE_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: algowinbet site-push --db data/offline.db
      - name: save local database
        if: always() && hashFiles('data/offline.db') != ''
        uses: actions/cache/save@v6
        with:
          path: data/offline.db
          key: offline-db-${{ github.run_id }}-${{ github.run_attempt }}
