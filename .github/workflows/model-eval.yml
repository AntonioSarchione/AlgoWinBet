name: model-eval

# Walk-forward comparison of goal-model variants on the results stored on Turso (no API request, no write).
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "settimane da rigiocare (fino a lunedì scorso)"
        required: false
        default: "52"
      variants:
        description: "varianti separate da spazio (vuoto = tutte): base senza-elo-nazionali senza-storico-nazionali storico-nazionali-2 storico-nazionali-6 elo-nazionali-0.08 elo-nazionali-0.25 campionati elo-club emivita-180 emivita-540 xg-0.3 xg-0.5 xg-0.7 tutto nazionali-emivita-730 nazionali-emivita-1460 nazionali-importanza"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      - name: run
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WEEKS: ${{ inputs.weeks }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          # inputs arrive as environment variables, never interpolated into the script
          args=(--db turso --weeks "${WEEKS:-52}")
          if [ -n "$VARIANTS" ]; then args+=(--variants $VARIANTS); fi
          TURSO_MODE=replica TURSO_REPLICA_PATH=data/turso-replica.db algowinbet model-eval "${args[@]}"
