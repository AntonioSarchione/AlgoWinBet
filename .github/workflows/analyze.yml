# Analysis on the data collected in the archive (read-only on the data providers: no API request is spent here).
# Manual for now; it will be scheduled (morning + after lineups) once the output is published somewhere readable.
name: analyze

on:
  workflow_dispatch:
    inputs:
      days:
        description: "giorni di palinsesto da analizzare"
        default: "2"
      fair:
        description: "solo probabilità del modello (senza quote)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turso]"
      # read only (the archive, .github/actions/offline-db): nothing is saved back
      - uses: ./.github/actions/offline-db
      - name: analyze
        env:
          PYTHONUNBUFFERED: "1"
          DAYS: ${{ inputs.days }}
          FAIR: ${{ inputs.fair }}
        run: |
          if [ "$FAIR" = "true" ]; then algowinbet analyze --provider snapshots --db data/offline.db --days "$DAYS" --fair
          else algowinbet analyze --provider snapshots --db data/offline.db --days "$DAYS"; fi
