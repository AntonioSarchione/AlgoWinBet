# FotMob in its own run (public pages, no key), so its pages never slow down the collect ticks: absences and official XI of
# the coming matches (morning, 3 hours before, then every few minutes from 75 minutes before kickoff until the XI is out),
# then player stats of the finished matches and the day's history slice. See src/algowinbet/fotmobprematch.py.
# The collect ticks start it when pages are due (GitHub's cron starts runs late or never); the cron here is only a fallback.
# A run never fails (no e-mail). When it brings something worth a new analysis (a regular out or doubtful, an official XI),
# it starts a collect run that publishes at once instead of waiting for the next tick.
name: fotmob

on:
  schedule:
    - cron: "17 7-22/3 * * *"  # fallback
  workflow_dispatch:

concurrency:
  group: offline-db  # every run that writes the local database, one at a time (was: fotmob)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # to start the collect run that publishes the new analysis

jobs:
  fotmob:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e ".[turso]"
      # Turso blocked until 2026-11-01: a plain SQLite copy kept in the Actions cache (.github/actions/offline-db)
      - uses: ./.github/actions/offline-db
      - name: fotmob-tick
        id: tick
        env:
          PYTHONUNBUFFERED: "1"
        run: algowinbet fotmob-tick --config configs/collect.json --db data/offline.db
      - name: new analysis
        if: steps.tick.outputs.reanalyse != '' && steps.tick.outputs.reanalyse != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish=true
      # Site database (docs/SITE_DB.md): only the differences since the last push; without SITE_DATABASE_URL it does nothing
      - name: site push
        if: always() && hashFiles('data/offline.db') != ''
        env:
          SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
          SITE_AUTH_TOKEN: ${{ secrets.SITE_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: algowinbet site-push --db data/offline.db
      - name: save local database
        if: always() && hashFiles('data/offline.db') != ''
        uses: actions/cache/save@v6
        with:
          path: data/offline.db
          key: offline-db-${{ github.run_id }}-${{ github.run_attempt }}
