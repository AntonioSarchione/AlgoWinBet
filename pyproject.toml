[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algowinbet"
version = "0.1.0"
description = "AlgoWinBet: probabilistic market analysis engine (personal use, paper-only)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
algowinbet = "algowinbet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
